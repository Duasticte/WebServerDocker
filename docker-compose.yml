services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: webserver_nginx
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: webserver_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webserver
      MYSQL_USER: webuser
      MYSQL_PASSWORD: webpassword
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webserver_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
